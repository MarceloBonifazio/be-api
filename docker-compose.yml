name: nucleus-customers
services:
  gateway:
    image: traefik:v3.3
    command:
      - --providers.file.filename=/etc/traefik/routes.yml
      - --entrypoints.web.address=:8088
    ports: ["8088:8088"]
    volumes: ["./dev/routes.yml:/etc/traefik/routes.yml:ro"]
    depends_on: [be-api, fe-painel, keycloak]
  be-api:
    build: { context: ., target: runner }
    environment:
      PORT: "4000"
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/app
      DB_USER: app
      DB_PASSWORD: app
      KAFKA_BROKERS: redpanda:9092
      OIDC_ISSUER: http://localhost:8088/auth/realms/nucleus
      OIDC_JWKS: http://keycloak:8080/auth/realms/nucleus/protocol/openid-connect/certs
      SCORE_URL: http://score:8080
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
  fe-painel:
    build: { context: ../fe-painel, target: runner }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    volumes: ["customer-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 30
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 512M, --reserve-memory, 0M, --node-id, "0", --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda:9092"]
    volumes: ["kafka-data:/var/lib/redpanda/data"]
    healthcheck:
      test: [CMD, rpk, cluster, health, --exit-when-healthy]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in be-api.events be-api.status-commands be-api.status-commands.DLT; do
          rpk topic describe "$$topic" --brokers redpanda:9092 >/dev/null 2>&1 || rpk topic create "$$topic" -p 3 --brokers redpanda:9092
        done
  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.2.5
    command: [start-dev, --import-realm, --http-relative-path=/auth, --proxy-headers=xforwarded]
    environment:
      JAVA_OPTS_APPEND: "-XX:ActiveProcessorCount=2"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
      KC_BOOTSTRAP_ADMIN_USERNAME: operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: operator-dev
      KC_HOSTNAME: http://localhost:8088/auth
    volumes: ["./dev/keycloak:/opt/keycloak/data/import:ro", "identity-data:/opt/keycloak/data"]
  score:
    restart: unless-stopped
    image: wiremock/wiremock:3.12.1
    command: [--global-response-templating]
    volumes: ["./dev/score:/home/wiremock:ro"]
volumes:
  customer-data:
  kafka-data:
  identity-data:
