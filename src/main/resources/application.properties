spring.application.name=score
server.port=${PORT:4000}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://be-api-postgres:5432/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8088/auth/realms/nucleus}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://keycloak:8080/auth/realms/nucleus/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=be-api
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:redpanda:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.consumer.group-id=${KAFKA_GROUP:be-api-status}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
app.kafka.events-topic=${KAFKA_TOPIC:be-api.events}
app.kafka.status-topic=${KAFKA_STATUS_TOPIC:be-api.status-commands}
app.score.url=${SCORE_URL:http://score:8080}
app.score.connect-timeout=${SCORE_CONNECT_TIMEOUT:2s}
app.score.read-timeout=${SCORE_READ_TIMEOUT:3s}
app.outbox.delay=${OUTBOX_DELAY:2000}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
server.error.include-message=never
